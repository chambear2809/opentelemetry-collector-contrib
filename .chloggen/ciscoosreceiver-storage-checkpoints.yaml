component: receiver/cisco_os
note: Add optional storage-backed durable checkpoints for Cisco receiver delivery state.
issues: [0]
subtext: |
  Persists accepted log deduplication, FMC eStreamer resume state, and accumulated delta counters with bounded two-slot copy-on-write pages and separately published versioned manifests, stable secret-free target identities, restart restoration, clock-rollback-safe time normalization, and fail-open handling for corrupt or transiently unavailable storage after client acquisition. Legacy unslotted manifests migrate in place, partial storage batches cannot mix committed generations, failed restores fence writes until a safe replacement is possible, and FMC resume cursors never advance beyond local observation time.
