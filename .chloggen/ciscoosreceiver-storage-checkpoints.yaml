change_type: enhancement
component: receiver/cisco_os
note: Add optional storage-backed durable checkpoints for Cisco receiver delivery state.
issues: [0]
subtext: |
  Persists accepted log deduplication, FMC eStreamer resume state, and accumulated delta counters with bounded two-slot copy-on-write pages and separately published versioned manifests, stable secret-free target identities, restart restoration, clock-rollback-safe time normalization, and fail-open handling for corrupt or transiently unavailable storage after client acquisition. Durable checkpoint storage requires non-expiring keys, durable ordered stage writes, per-key invocation-ordered/read-after-success manifest operations, and one active writer per checkpoint identity. Legacy unslotted manifests migrate in place, partial storage batches cannot mix committed generations, failed restores fence writes until a safe replacement is possible, and FMC resume cursors never advance beyond local observation time. Stale fixed-slot and legacy keys are retained instead of synchronously deleted, keeping storage bounded per stable identity without allowing cleanup to delay publication or shutdown; identity churn can retain old bounded namespaces until operators remove them after all referencing Collectors stop. During shutdown, accepted polling counter and non-ISE log snapshots are retained until polling workers terminate, then flushed with a bounded live context before storage closes; this ordered cleanup continues independently if the original shutdown caller's deadline expires.
