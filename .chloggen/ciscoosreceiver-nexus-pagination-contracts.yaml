note: Prevent Nexus Dashboard collection from silently truncating paginated API responses.
issues: [0]
subtext: |
  Apply documented per-route pagination contracts, safely advance metadata-free offset pages, discard exact cross-page overlaps without consuming the configured unique-result cap, and surface unverified legacy responses as partial instead of guessing that a nonempty page is complete. Fail closed when decoding recognized collection envelopes, escape selector segments exactly once, confine continuation metadata to the configured origin and reverse-proxy prefix while rejecting traversal, redact server-provided continuation URLs and queries from transport errors, and handle encoded path prefixes in linear work.
