change_type: breaking
component: receiver/cisco_os
note: Harden Cisco dial-out identity and bound normalized and shared gNMI state.
issues: [42647]
subtext: |
  Dial-out now fails closed unless the linked yang_grpc receiver advertises runtime-hardening contract v2. Adds source-to-node identity bindings for production dial-out, collision-safe raw YANG paths and present-empty key identity, escapes structural bytes in direct gNMI path attributes, and rejects multi-entry complex JSON arrays whose effective identities are not unique. It also bounds normalized datapoint attributes, notification-wide JSON and protobuf expansion, path and cache memory, partitions cache capacity across targets, enforces one combined stream-by-frame envelope across selected gNMI dial-in targets and enabled dial-out servers, caps shared and deprecated gNMI response and notification processing, retries transient SD-WAN JWT authentication, and preserves state for redelivery when downstream consumers refuse telemetry. Receiver-private middleware adds max_streams_per_client, preserves rate-limit buckets until natural refill, and rejects cleanup intervals below one second.
