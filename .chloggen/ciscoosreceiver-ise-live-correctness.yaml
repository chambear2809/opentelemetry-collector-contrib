note: Harden and validate Cisco ISE 3.4 collection with release-safe defaults.
issues: [0]
subtext: |
  Keep only the three scalar MnT session counters enabled by default and move row-level ActiveList and AuthList collection into the opt-in session_details group. Also correct OpenAPI v1 paths and scalar/list response handling, negotiate ERS enhanced-CSRF sessions, send ERS's required exact JSON Accept header, reject redirects and HTML API responses, fix authoritative ERS pagination, keep AAA metrics semantically distinct, report truncated inventories as partial, load bounded PBES2/PBKDF2 AES-CBC and Cisco ISE legacy PKCS#12 PBE password-protected PKCS#8 pxGrid keys without writing decrypted material to disk, send pxGrid STOMP traffic in binary WebSocket frames with bounded WebSocket Ping control keepalives instead of raw STOMP newline heartbeats, add verified PEM CA/SAN support for Data Connect, and provide bounded REST, pxGrid, and Data Connect live gates.
