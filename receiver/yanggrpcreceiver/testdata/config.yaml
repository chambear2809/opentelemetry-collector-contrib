yang_grpc/default:
  endpoint: localhost:57500
  transport: tcp
  keepalive:
    server_parameters:
      time: 30s
      timeout: 10s
  max_concurrent_streams: 64
  max_concurrent_streams_per_client: 16
  max_recv_msg_size_mib: 4
  stream_idle_timeout: 5m
  security:
    rate_limiting:
      burst_size: 10
      cleanup_interval: 1m0s
      enabled: false
      requests_per_second: 100
  yang:
    module_paths: []
yang_grpc/production:
  endpoint: "0.0.0.0:57500"
  # TLS/mTLS Configuration
  tls:
    cert_file: "/etc/otel/certs/server.crt"
    key_file: "/etc/otel/certs/server.key"
    client_ca_file: "/etc/otel/certs/ca.crt"
    min_version: "1.2"
    max_version: "1.3"
    reload_interval: 5m

  # Security & Rate Limiting
  security:
    rate_limiting:
      enabled: true
      requests_per_second: 100.0
      burst_size: 10
      cleanup_interval: 1m
    allowed_clients:
      - "10.0.0.0/8"
      - "192.168.0.0/16"

  # Performance Settings
  max_concurrent_streams: 64
  max_concurrent_streams_per_client: 16
  max_recv_msg_size_mib: 4
  stream_idle_timeout: 5m

  # Keep-Alive Configuration
  keepalive:
    server_parameters:
      time: 30s
      timeout: 10s

  # YANG Parser Configuration
  yang:
    module_paths:
      - /etc/otelcol/yang
