$defs:
  rate_limiting_config:
    description: RateLimitingConfig contains rate limiting configuration
    type: object
    properties:
      burst_size:
        description: BurstSize is the maximum burst size for rate limiting
        type: integer
      cleanup_interval:
        description: CleanupInterval is how often to clean up idle rate limiter entries. Values below one second are rejected to prevent a hot cleanup loop.
        type: string
        format: duration
      enabled:
        description: Enabled indicates whether rate limiting should be enabled
        type: boolean
      requests_per_second:
        description: RequestsPerSecond is the maximum number of received messages per second per client.
        type: number
        x-customType: float64
  security_config:
    description: SecurityConfig contains security hardening options
    type: object
    properties:
      allowed_clients:
        description: AllowedClients contains client IP allowlist configuration
        type: array
        items:
          type: string
      rate_limiting:
        description: RateLimiting contains rate limiting configuration
        $ref: rate_limiting_config
  yang_config:
    description: YANGConfig contains YANG parser configuration
    type: object
    properties:
      module_paths:
        description: ModulePaths defines up to 64 regular .yang files or directories containing .yang files. This is used by the internal parser to resolve Cisco-specific schemas.
        type: array
        items:
          type: string
description: Config defines configuration for yanggrpc receiver.
type: object
properties:
  connection_timeout:
    description: ConnectionTimeout bounds connection establishment through the HTTP/2 handshake. Zero uses the default of 30 seconds.
    type: string
    format: duration
  max_concurrent_conversions:
    description: MaxConcurrentConversions bounds telemetry messages being converted and consumed concurrently across all streams. Zero uses the default of 8.
    type: integer
    x-customType: uint32
  max_concurrent_streams_per_client:
    description: MaxConcurrentStreamsPerClient limits active telemetry streams from one transport peer across all of its connections. Zero uses the smaller of 16 and MaxConcurrentStreams. An explicit value must not exceed MaxConcurrentStreams.
    type: integer
    x-customType: uint32
  max_connections:
    description: MaxConnections is the maximum number of accepted network connections. Zero uses the default of 256.
    type: integer
    x-customType: uint32
  security:
    description: Security contains security hardening configuration
    $ref: security_config
  stream_idle_timeout:
    description: StreamIdleTimeout closes an admitted telemetry stream when no message is received for this duration. Zero uses the default of 5 minutes.
    type: string
    format: duration
  yang:
    description: YANG contains YANG parser configuration
    $ref: yang_config
allOf:
  - $ref: go.opentelemetry.io/collector/config/configgrpc.server_config
