receivers:
  cisco_os:
    gnmi:
      # This demonstrates secure configuration, not product qualification.
      # Enable a domain only when its exact PID/release row is Live Qualified
      # in docs/gnmi-coverage.md for the intended deployment.
      max_datapoints_per_chunk: 10000
      max_cached_series: 500000
      targets:
        - name: nexus-shard-01
          endpoint: nexus01.example.net:50051
          platform: nx_os
          product_family: nx_os
          max_recv_msg_size_mib: 16
          sync_timeout: 2m
          encoding_preference: [json, json_ietf]
          credentials:
            mode: username_password
            username: otel-telemetry
            password: ${env:CISCO_GNMI_PASSWORD}
          tls:
            ca_file: /etc/otel/cisco-ca.pem
            # Keep false in production. Set true only in an isolated lab when
            # the certificate cannot be verified with a trusted CA bundle.
            insecure_skip_verify: false
            min_version: "1.2"
            server_name_override: nexus01.example.net
            reload_interval: 1h
          profiles:
            identity:
              enabled: true
            interfaces:
              enabled: true
            optics:
              enabled: true
              required: true
              sample_interval: 30s
              stream_mode: sample

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 3072
    spike_limit_mib: 512
  batch: {}

exporters:
  otlphttp/splunk:
    endpoint: ${env:SPLUNK_OTLP_ENDPOINT}
    headers:
      X-SF-TOKEN: ${env:SPLUNK_ACCESS_TOKEN}

service:
  pipelines:
    metrics:
      receivers: [cisco_os]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/splunk]
