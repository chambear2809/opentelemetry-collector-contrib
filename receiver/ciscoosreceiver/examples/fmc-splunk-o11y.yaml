receivers:
  cisco_os/fmc:
    collection_interval: 60s
    timeout: 45s
    fmc:
      enabled: true
      controllers:
        - endpoint: ${env:FMC_ENDPOINT}
          name: fmc-primary
      auth:
        username: ${env:FMC_USERNAME}
        password: ${env:FMC_PASSWORD}
      # Keep verification enabled for production endpoints. Set this only for
      # an isolated lab or sandbox whose certificate cannot be verified.
      insecure_skip_verify: false
      event_lookback: 24h
      manager:
        enabled: true
      inventory:
        enabled: true
        max_results: 200
      interfaces:
        enabled: true
        max_results: 500
      health:
        enabled: true
        max_results: 200
      vpn:
        enabled: true
        max_results: 200
      ha:
        enabled: true
        max_results: 100
      policy:
        enabled: true
        max_results: 500
      deployments:
        enabled: true
        max_results: 200
      # Audit is log-only evidence. Keep it disabled unless a log destination is
      # configured intentionally.
      audit:
        enabled: false

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256
  resource/fmc:
    attributes:
      - key: service.name
        value: cisco-fmc
        action: upsert
      - key: deployment.environment.name
        value: ${env:SPLUNK_ENVIRONMENT}
        action: upsert
  batch:
    timeout: 5s

exporters:
  otlp_http/splunk:
    metrics_endpoint: https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp
    headers:
      X-SF-Token: ${env:SPLUNK_ACCESS_TOKEN}
    compression: gzip
    timeout: 15s
    sending_queue:
      enabled: true
    retry_on_failure:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [cisco_os/fmc]
      processors: [memory_limiter, resource/fmc, batch]
      exporters: [otlp_http/splunk]
