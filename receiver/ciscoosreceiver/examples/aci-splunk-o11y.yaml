receivers:
  cisco_os/aci:
    collection_interval: 60s
    timeout: 45s
    aci:
      enabled: true
      controllers:
        - endpoint: ${env:APIC_ENDPOINT}
          name: apic-primary
      auth:
        username: ${env:APIC_USERNAME}
        password: ${env:APIC_PASSWORD}
      # Verification remains enabled by default. Set this only for an isolated
      # lab whose APIC certificate cannot be trusted through the host CA store.
      insecure_skip_verify: false
      event_lookback: 24h

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256
  resource/aci:
    attributes:
      - key: service.name
        value: cisco-aci
        action: upsert
      - key: deployment.environment.name
        value: ${env:SPLUNK_ENVIRONMENT}
        action: upsert
  batch:
    timeout: 5s

exporters:
  otlp_http/splunk:
    metrics_endpoint: https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp
    headers:
      X-SF-Token: ${env:SPLUNK_ACCESS_TOKEN}
    compression: gzip
    timeout: 15s
    sending_queue:
      enabled: true
    retry_on_failure:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [cisco_os/aci]
      processors: [memory_limiter, resource/aci, batch]
      exporters: [otlp_http/splunk]
    # Splunk Observability Cloud's metric ingest is handled above. Keep APIC
    # fault/audit/event logs local unless a Splunk Platform HEC destination is
    # configured explicitly.
    logs:
      receivers: [cisco_os/aci]
      processors: [memory_limiter, resource/aci, batch]
      exporters: [debug]
