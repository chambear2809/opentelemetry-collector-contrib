---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cisco-gnmi-shard-01
  namespace: cisco-telemetry
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cisco-gnmi
      app.kubernetes.io/instance: shard-01
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cisco-gnmi-shard-02
  namespace: cisco-telemetry
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cisco-gnmi
      app.kubernetes.io/instance: shard-02
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cisco-gnmi-egress
  namespace: cisco-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cisco-gnmi
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        # Replace with management-network target CIDRs.
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 50051
    - to:
        # Replace with an approved HTTPS egress gateway CIDR.
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - protocol: TCP
          port: 443
