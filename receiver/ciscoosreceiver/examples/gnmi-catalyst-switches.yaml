receivers:
  cisco_os:
    gnmi:
      max_datapoints_per_chunk: 10000
      max_cached_series: 500000
      targets:
        - name: catalyst-9300-standalone-01
          endpoint: c9300-01.example.net:9339
          product: catalyst_9300
          software_version: "17.18.1"
          # Required while retained physical-device qualification is Not run.
          # This acknowledgement does not qualify the target.
          allow_unqualified: true
          encoding_preference: [json_ietf]
          credentials:
            mode: username_password
            username: otel-telemetry
            password: ${env:CISCO_GNMI_PASSWORD}
          tls:
            ca_file: /etc/otel/cisco-ca.pem
            min_version: "1.2"
            server_name_override: c9300-01.example.net
            reload_interval: 1h
          profiles:
            identity:
              enabled: true
            system:
              enabled: true
            interfaces:
              enabled: true
            optics:
              # Enable only after separate chassis/line-card/optic qualification.
              enabled: false

        - name: catalyst-9500-standalone-01
          endpoint: c9500-01.example.net:9339
          product: catalyst_9500
          software_version: "17.18.1"
          allow_unqualified: true
          encoding_preference: [json_ietf]
          credentials:
            mode: username_password
            username: otel-telemetry
            password: ${env:CISCO_GNMI_PASSWORD}
          tls:
            ca_file: /etc/otel/cisco-ca.pem
            min_version: "1.2"
            server_name_override: c9500-01.example.net
            reload_interval: 1h
          profiles:
            identity:
              enabled: true
            system:
              enabled: true
            interfaces:
              enabled: true
            optics:
              enabled: false

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 3072
    spike_limit_mib: 512
  batch: {}

exporters:
  otlphttp/splunk:
    endpoint: ${env:SPLUNK_OTLP_ENDPOINT}
    headers:
      X-SF-TOKEN: ${env:SPLUNK_ACCESS_TOKEN}

service:
  pipelines:
    metrics:
      receivers: [cisco_os]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/splunk]
