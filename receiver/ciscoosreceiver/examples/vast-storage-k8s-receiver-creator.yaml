# Example CSI scrape configuration for VAST Storage in Cisco AI POD Kubernetes
# clusters. Use this alongside a VMS scrape receiver, or merge the receivers and
# processors into the same Splunk OTel Collector values.yaml.

extensions:
  k8s_observer:
    auth_type: serviceAccount
    observe_pods: true
    observe_services: true
    namespaces:
      - vast-csi

receivers:
  receiver_creator/cisco-ai-pods:
    watch_observers: [k8s_observer]
    receivers:
      prometheus/vast_csi_node:
        rule: type == "port" && pod.namespace == "vast-csi" && (port == 9090 || port == 9092)
        config:
          config:
            scrape_configs:
              - job_name: vast-csi-node-metrics
                scrape_interval: 30s
                metrics_path: /metrics
                static_configs:
                  - targets:
                      - '`endpoint`:`port`'
        resource_attributes:
          storage.vendor: vast
          ai.pod.component: storage
          vast.csi.role: node
          k8s.namespace.name: '`pod.namespace`'
          k8s.pod.name: '`pod.name`'

      prometheus/vast_csi_controller:
        rule: type == "port" && pod.namespace == "vast-csi" && (port == 9091 || port == 9093)
        config:
          config:
            scrape_configs:
              - job_name: vast-csi-controller-metrics
                scrape_interval: 30s
                metrics_path: /metrics
                static_configs:
                  - targets:
                      - '`endpoint`:`port`'
        resource_attributes:
          storage.vendor: vast
          ai.pod.component: storage
          vast.csi.role: controller
          k8s.namespace.name: '`pod.namespace`'
          k8s.pod.name: '`pod.name`'

processors:
  resource/vast_storage:
    attributes:
      - key: vast.cluster
        value: ${env:VAST_CLUSTER}
        action: upsert
      - key: k8s.cluster.name
        value: ${env:CLUSTER_NAME}
        action: upsert
      - key: deployment.environment
        value: ${env:ENVIRONMENT_NAME}
        action: upsert
      - key: environment
        value: ${env:ENVIRONMENT_NAME}
        action: upsert
  batch:

exporters:
  signalfx:
    access_token: ${env:SPLUNK_ACCESS_TOKEN}
    realm: ${env:SPLUNK_REALM}
  debug:
    verbosity: detailed

service:
  extensions:
    - k8s_observer
  pipelines:
    metrics/vast-csi:
      receivers:
        - receiver_creator/cisco-ai-pods
      processors:
        - resource/vast_storage
        - batch
      exporters:
        - signalfx
        # Keep debug during validation, then remove it in production.
        - debug
