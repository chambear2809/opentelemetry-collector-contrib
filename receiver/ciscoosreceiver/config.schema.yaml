$defs:
  aci_config:
    description: ACIConfig defines APIC API polling settings.
    type: object
    properties:
      audit:
        $ref: nexus_controller_group_config
      auth:
        $ref: controller_auth_config
      ca_file:
        type: string
      controller_health:
        $ref: nexus_controller_group_config
      controllers:
        type: array
        items:
          $ref: aci_controller_config
      enabled:
        type: boolean
      endpoints:
        $ref: nexus_controller_group_config
      event_lookback:
        type: string
        format: duration
      events:
        $ref: nexus_controller_group_config
      fabric:
        $ref: nexus_controller_group_config
      faults:
        $ref: nexus_controller_group_config
      insecure_skip_verify:
        type: boolean
      max_retries:
        type: integer
      nodes:
        $ref: nexus_controller_group_config
      page_size:
        type: integer
      server_name:
        type: string
      stats:
        $ref: nexus_controller_group_config
      targets:
        $ref: aci_target_filters
      tenants:
        $ref: nexus_controller_group_config
      topology:
        $ref: nexus_controller_group_config
      user_agent:
        type: string
  aci_controller_config:
    description: ACIControllerConfig represents a single APIC controller endpoint.
    type: object
    properties:
      endpoint:
        type: string
      name:
        type: string
  aci_target_filters:
    description: ACITargetFilters limits APIC collection to relevant nodes, tenants, and objects.
    type: object
    properties:
      bridge_domains:
        type: array
        items:
          type: string
      epgs:
        type: array
        items:
          type: string
      fabrics:
        type: array
        items:
          type: string
      interface_names:
        type: array
        items:
          type: string
      node_ids:
        type: array
        items:
          type: string
      serials:
        type: array
        items:
          type: string
      sites:
        type: array
        items:
          type: string
      tenants:
        type: array
        items:
          type: string
      vrfs:
        type: array
        items:
          type: string
  catalyst_9800_config:
    description: Catalyst9800Config defines direct Catalyst 9800 WLC telemetry settings.
    type: object
    properties:
      dial_in:
        $ref: catalyst_9800_dial_in_config
      dial_out:
        $ref: catalyst_9800_dial_out_config
      enabled:
        type: boolean
      encoding_preference:
        type: array
        items:
          type: string
      max_datapoints_per_batch:
        type: integer
      path_groups:
        type: object
        additionalProperties:
          $ref: catalyst_9800_path_group_config
      paths:
        $ref: catalyst_9800_path_override_config
      subscription:
        $ref: catalyst_9800_subscription_config
      unsupported_path_action:
        type: string
  catalyst_9800_credentials_config:
    description: Catalyst9800CredentialsConfig represents Catalyst 9800 gNMI metadata credentials.
    type: object
    properties:
      password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      username:
        type: string
  catalyst_9800_dial_in_config:
    description: Catalyst9800DialInConfig defines dynamic Catalyst 9800 gNMI subscriptions initiated by the collector.
    type: object
    properties:
      targets:
        type: array
        items:
          $ref: catalyst_9800_target_config
  catalyst_9800_dial_out_config:
    description: Catalyst9800DialOutConfig defines Catalyst 9800 MDT gRPC dial-out server settings.
    type: object
    properties:
      allowed_clients:
        type: array
        items:
          type: string
      enabled:
        type: boolean
      identity_bindings:
        type: array
        items:
          $ref: gnmi_dial_out_identity_binding_config
      identity_verification:
        description: IdentityVerification controls whether source-to-node identity bindings are enforced for every MDT message. Valid values are legacy and required.
        type: string
      max_streams_per_client:
        description: MaxStreamsPerClient bounds concurrent dial-out streams from one source IP. Zero selects the smaller of 16 and MaxConcurrentStreams.
        type: integer
        x-customType: uint32
      module_paths:
        description: ModulePaths contains up to 64 regular .yang files or directories. Startup bounds traversal to 100,000 entries, 10,000 files, 16 MiB per file, and 128 MiB of module data across all configured paths.
        type: array
        items:
          type: string
      rate_limiting:
        $ref: /receiver/yanggrpcreceiver.rate_limiting_config
      stream_idle_timeout:
        description: StreamIdleTimeout closes a dial-out stream that sends no telemetry frame for this duration. Zero selects the production default of 30 minutes.
        type: string
        format: duration
    allOf:
      - $ref: go.opentelemetry.io/collector/config/configgrpc.server_config
  catalyst_9800_path_group_config:
    description: Catalyst9800PathGroupConfig controls a curated Catalyst 9800 telemetry path group.
    type: object
    properties:
      enabled:
        type: boolean
  catalyst_9800_path_override_config:
    description: Catalyst9800PathOverrideConfig provides custom Catalyst 9800 path include/exclude controls.
    type: object
    properties:
      exclude:
        type: array
        items:
          type: string
      include:
        type: array
        items:
          type: string
  catalyst_9800_subscription_config:
    description: Catalyst9800SubscriptionConfig defines Catalyst 9800 gNMI subscription behavior.
    type: object
    properties:
      allow_aggregation:
        x-optional: true
        type: boolean
      heartbeat_interval:
        type: string
        format: duration
      mode:
        type: string
      poll_interval:
        type: string
        format: duration
      sample_interval:
        type: string
        format: duration
      stream_mode:
        type: string
      suppress_redundant:
        x-optional: true
        type: boolean
      updates_only:
        x-optional: true
        type: boolean
  catalyst_9800_target_config:
    description: Catalyst9800TargetConfig identifies one Catalyst 9800 gNMI dial-in target.
    type: object
    properties:
      credentials:
        $ref: catalyst_9800_credentials_config
      encoding_preference:
        type: array
        items:
          type: string
      name:
        type: string
      path_groups:
        type: object
        additionalProperties:
          $ref: catalyst_9800_path_group_config
      paths:
        $ref: catalyst_9800_path_override_config
      platform_family:
        type: string
      skip_capabilities:
        type: boolean
      subscription:
        $ref: catalyst_9800_subscription_config
    allOf:
      - $ref: go.opentelemetry.io/collector/config/configgrpc.client_config
  catalyst_center_auth_config:
    description: CatalystCenterAuthConfig represents Catalyst Center API token authentication settings.
    type: object
    properties:
      aes_credentials:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      mode:
        type: string
      password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      username:
        type: string
  catalyst_center_config:
    description: CatalystCenterConfig defines native Catalyst Center API polling settings.
    type: object
    properties:
      auth:
        $ref: catalyst_center_auth_config
      details:
        $ref: catalyst_center_group_config
      enabled:
        type: boolean
      endpoint:
        type: string
      health:
        $ref: catalyst_center_group_config
      insecure_skip_verify:
        type: boolean
      interfaces:
        $ref: catalyst_center_group_config
      inventory:
        $ref: catalyst_center_group_config
      issues:
        $ref: catalyst_center_group_config
      lookback:
        type: string
        format: duration
      max_retries:
        type: integer
      page_size:
        type: integer
      targets:
        $ref: catalyst_center_target_filters
      topology:
        $ref: catalyst_center_group_config
      user_agent:
        type: string
  catalyst_center_device_detail_target:
    description: CatalystCenterDeviceDetailTarget identifies a device-detail lookup.
    type: object
    properties:
      identifier:
        type: string
      search_by:
        type: string
  catalyst_center_group_config:
    description: CatalystCenterGroupConfig controls a curated Catalyst Center collection group.
    type: object
    properties:
      enabled:
        type: boolean
      max_results:
        type: integer
  catalyst_center_target_filters:
    description: CatalystCenterTargetFilters limits Catalyst Center detail collection to known resources.
    type: object
    properties:
      client_macs:
        type: array
        items:
          type: string
      device_details:
        type: array
        items:
          $ref: catalyst_center_device_detail_target
  controller_auth_config:
    description: ControllerAuthConfig represents username/password or API-key authentication for Nexus controllers.
    type: object
    properties:
      api_key:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      domain:
        type: string
      mode:
        type: string
      password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      username:
        type: string
  device_config:
    description: DeviceConfig represents configuration for a single Cisco device in the devices list.
    type: object
    properties:
      auth:
        $ref: ./internal/connection.auth_config
      host:
        type: string
      name:
        type: string
      port:
        type: integer
  device_selection_config:
    description: DeviceSelectionConfig defines shared device include/exclude filters across Cisco providers.
    type: object
    properties:
      exclude:
        $ref: device_selection_match_config
      include:
        $ref: device_selection_match_config
  device_selection_match_config:
    description: DeviceSelectionMatchConfig defines one side of the shared device selector.
    type: object
    properties:
      device_ids:
        type: array
        items:
          type: string
      host_ids:
        type: array
        items:
          type: string
      host_ips:
        type: array
        items:
          type: string
      host_names:
        type: array
        items:
          type: string
      serials:
        type: array
        items:
          type: string
  fmc_config:
    description: FMCConfig defines Secure Firewall Management Center REST and eStreamer settings.
    type: object
    properties:
      audit:
        $ref: fmc_group_config
      auth:
        $ref: controller_auth_config
      controllers:
        type: array
        items:
          $ref: fmc_controller_config
      deployments:
        $ref: fmc_group_config
      enabled:
        type: boolean
      estreamer:
        $ref: fmce_streamer_config
      event_lookback:
        type: string
        format: duration
      ha:
        $ref: fmc_group_config
      health:
        $ref: fmc_group_config
      insecure_skip_verify:
        type: boolean
      interfaces:
        $ref: fmc_group_config
      inventory:
        $ref: fmc_group_config
      manager:
        $ref: fmc_group_config
      max_retries:
        type: integer
      page_size:
        type: integer
      policy:
        $ref: fmc_group_config
      targets:
        $ref: fmc_target_filters
      user_agent:
        type: string
      vpn:
        $ref: fmc_group_config
  fmc_controller_config:
    description: FMCControllerConfig represents a single Secure Firewall Management Center endpoint.
    type: object
    properties:
      domain_uuid:
        type: string
      endpoint:
        type: string
      name:
        type: string
  fmc_group_config:
    description: FMCGroupConfig controls a curated FMC collection group.
    type: object
    properties:
      enabled:
        type: boolean
      max_results:
        type: integer
  fmc_target_filters:
    description: FMCTargetFilters limits FMC collection to relevant managed firewalls, policies, and interfaces.
    type: object
    properties:
      device_ids:
        type: array
        items:
          type: string
      interface_names:
        type: array
        items:
          type: string
      management_ips:
        type: array
        items:
          type: string
      names:
        type: array
        items:
          type: string
      policy_ids:
        type: array
        items:
          type: string
      policy_names:
        type: array
        items:
          type: string
      serials:
        type: array
        items:
          type: string
  fmce_streamer_config:
    description: FMCEStreamerConfig controls high-fidelity Secure Firewall event streaming.
    type: object
    properties:
      enabled:
        type: boolean
      event_types:
        type: array
        items:
          type: string
      lookback:
        type: string
        format: duration
      max_message_bytes:
        type: integer
      reconnect_interval:
        type: string
        format: duration
      targets:
        type: array
        items:
          $ref: fmce_streamer_target_config
      tls:
        $ref: fmce_streamer_tls_config
  fmce_streamer_target_config:
    description: FMCEStreamerTargetConfig represents a single eStreamer endpoint.
    type: object
    properties:
      endpoint:
        type: string
      name:
        type: string
  fmce_streamer_tls_config:
    description: FMCEStreamerTLSConfig contains TLS settings for an eStreamer mutual-TLS client.
    type: object
    properties:
      ca_file:
        type: string
      cert_file:
        type: string
      insecure_skip_verify:
        type: boolean
      key_file:
        type: string
      server_name:
        type: string
  gnmi_config:
    description: GNMIConfig configures the shared production gNMI engine.
    type: object
    properties:
      max_cached_series:
        type: integer
      max_datapoints_per_chunk:
        type: integer
      targets:
        type: array
        items:
          $ref: gnmi_target_config
  gnmi_credentials_config:
    description: GNMICredentialsConfig configures the deliberately small set of supported gNMI authentication modes. Credentials are sent as gRPC metadata only for modes that include username/password.
    type: object
    properties:
      mode:
        type: string
      password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      username:
        type: string
  gnmi_custom_subscription_config:
    description: GNMICustomSubscriptionConfig defines explicitly mapped custom scalar paths. Origin is independent of every path; raw origin:path strings are rejected by the path parser. PathTarget is decoder-only and always rejected because every qualified direct-device product contract forbids proxy target prefixes.
    type: object
    properties:
      allow_aggregation:
        type: boolean
      encoding_preference:
        type: array
        items:
          type: string
      gnmi_extensions:
        $ref: gnmi_extensions_config
      mappings:
        type: array
        items:
          $ref: gnmi_metric_mapping_config
      mode:
        type: string
      models:
        description: Models lists exact Capabilities ModelData names required by this stream. It is mandatory for the generic OpenConfig origin because that origin is not itself a YANG module name.
        type: array
        items:
          type: string
      name:
        type: string
      origin:
        type: string
      path_target:
        description: PathTarget is a decoder-only migration field retained so validation can return an actionable error. It is never added to a qualified request.
        type: string
      paths:
        type: array
        items:
          $ref: gnmi_subscription_path_config
      poll_interval:
        type: string
        format: duration
      qos_marking:
        x-pointer: true
        type: integer
        x-customType: uint32
      required:
        type: boolean
      sample_interval:
        type: string
        format: duration
      updates_only:
        type: boolean
  gnmi_dial_out_identity_binding_config:
    description: GNMIDialOutIdentityBindingConfig binds one or more network sources to the node IDs those sources are permitted to claim in MDT telemetry payloads.
    type: object
    properties:
      node_ids:
        type: array
        items:
          type: string
      sources:
        type: array
        items:
          type: string
  gnmi_extensions_config:
    description: GNMIExtensionsConfig contains the bounded, read-only gNMI extensions supported by this receiver.
    type: object
    properties:
      depth:
        x-pointer: true
        type: integer
        x-customType: uint32
  gnmi_keepalive_config:
    description: GNMIKeepaliveConfig controls client-side HTTP/2 keepalive without exposing the Collector gRPC ClientConfig or arbitrary request headers.
    type: object
    properties:
      permit_without_stream:
        x-pointer: true
        type: boolean
      time:
        type: string
        format: duration
      timeout:
        type: string
        format: duration
  gnmi_metric_mapping_config:
    description: GNMIMetricMappingConfig is a complete scalar-to-gauge mapping. PathKeys maps "element.key" selectors to bounded OTLP attribute names.
    type: object
    properties:
      description:
        type: string
      gauge_type:
        type: string
      metric_name:
        type: string
      path:
        type: string
      path_keys:
        type: object
        additionalProperties:
          type: string
      scale:
        x-pointer: true
        type: number
        x-customType: float64
      unit:
        type: string
  gnmi_path_options_config:
    description: GNMIPathOptionsConfig controls how one path behaves within a STREAM SubscriptionList. Pointer fields preserve omission, including the gNMI SAMPLE convention where an explicit zero requests the fastest supported interval.
    type: object
    properties:
      heartbeat_interval:
        x-pointer: true
        type: string
        format: duration
      sample_interval:
        x-pointer: true
        type: string
        format: duration
      stream_mode:
        type: string
      suppress_redundant:
        x-pointer: true
        type: boolean
  gnmi_profile_config:
    description: 'GNMIProfileConfig controls one curated subscription profile. Pointer booleans preserve the distinction between an omitted value and enabled: false.'
    type: object
    properties:
      allow_aggregation:
        type: boolean
      enabled:
        x-pointer: true
        type: boolean
      encoding_preference:
        type: array
        items:
          type: string
      gnmi_extensions:
        $ref: gnmi_extensions_config
      path_overrides:
        type: object
        additionalProperties:
          $ref: gnmi_path_options_config
      qos_marking:
        x-pointer: true
        type: integer
        x-customType: uint32
      required:
        type: boolean
      sample_interval:
        type: string
        format: duration
      updates_only:
        type: boolean
  gnmi_profiles_config:
    description: GNMIProfilesConfig contains the normalized profile set.
    type: object
    properties:
      catalyst_9800_wireless:
        $ref: gnmi_profile_config
      identity:
        $ref: gnmi_profile_config
      interfaces:
        $ref: gnmi_profile_config
      optics:
        $ref: gnmi_profile_config
      system:
        $ref: gnmi_profile_config
  gnmi_subscription_path_config:
    description: GNMISubscriptionPathConfig is one explicit custom subscription selector. The selector may be an ancestor of one or more mapped scalar leaves.
    type: object
    properties:
      path:
        type: string
    allOf:
      - $ref: gnmi_path_options_config
  gnmi_target_config:
    description: GNMITargetConfig identifies one statically owned dial-in target.
    type: object
    properties:
      capabilities_timeout:
        type: string
        format: duration
      connect_timeout:
        type: string
        format: duration
      credentials:
        $ref: gnmi_credentials_config
      custom_subscriptions:
        type: array
        items:
          $ref: gnmi_custom_subscription_config
      encoding_preference:
        type: array
        items:
          type: string
      endpoint:
        description: Endpoint is a direct-device TCP endpoint in strict host:port form.
        type: string
      keepalive:
        $ref: gnmi_keepalive_config
      max_recv_msg_size_mib:
        type: integer
      max_streams:
        type: integer
      name:
        type: string
      platform:
        description: Platform remains decoder-only so configurations from the OS-family preview receive an actionable migration error instead of an unknown-key diagnostic. It is never used to select profiles or runtime behavior.
        type: string
      product:
        description: 'Product is one of the canonical product contracts: catalyst_9800, asr_9000, ncs_5500, nexus_9000, or nexus_3500.'
        type: string
      profiles:
        $ref: gnmi_profiles_config
      software_version:
        description: SoftwareVersion is the exact expected running build. Its canonical form must match the version observed during product identity preflight.
        type: string
      tls:
        $ref: gnmitls_config
  gnmitls_config:
    description: GNMITLSConfig exposes the TLS settings used by the shared client. Plaintext transport is always rejected. Certificate verification can be disabled only through the explicit lab-oriented InsecureSkipVerify option.
    type: object
    properties:
      ca_file:
        type: string
      cert_file:
        type: string
      insecure:
        type: boolean
      insecure_skip_verify:
        type: boolean
      key_file:
        type: string
      min_version:
        type: string
      reload_interval:
        type: string
        format: duration
      server_name_override:
        type: string
  intersight_auth_config:
    description: IntersightAuthConfig represents Cisco Intersight API key authentication.
    type: object
    properties:
      key_file:
        type: string
      key_id:
        type: string
      key_pem:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
  intersight_config:
    description: IntersightConfig defines native Cisco Intersight API polling settings.
    type: object
    properties:
      audit:
        $ref: intersight_group_config
      auth:
        $ref: intersight_auth_config
      enabled:
        type: boolean
      endpoint:
        type: string
      equipment:
        $ref: intersight_group_config
      event_lookback:
        type: string
        format: duration
      events:
        $ref: intersight_group_config
      firmware:
        $ref: intersight_group_config
      hyperflex:
        $ref: intersight_group_config
      insecure_skip_verify:
        type: boolean
      inventory:
        $ref: intersight_group_config
      kubernetes:
        $ref: intersight_group_config
      max_retries:
        type: integer
      network:
        $ref: intersight_group_config
      page_size:
        type: integer
      storage:
        $ref: intersight_group_config
      targets:
        $ref: intersight_target_filters
      telemetry:
        $ref: intersight_group_config
      telemetry_lookback:
        type: string
        format: duration
      user_agent:
        type: string
      virtualization:
        $ref: intersight_group_config
  intersight_group_config:
    description: IntersightGroupConfig controls a curated Intersight collection group.
    type: object
    properties:
      enabled:
        type: boolean
      max_results:
        type: integer
  intersight_target_filters:
    description: IntersightTargetFilters limits Intersight collection to known resources.
    type: object
    properties:
      moids:
        type: array
        items:
          type: string
      serials:
        type: array
        items:
          type: string
  iosxr_config:
    description: IOSXRConfig defines IOS XR gNMI/MDT telemetry settings.
    type: object
    properties:
      dial_in:
        $ref: iosxr_dial_in_config
      dial_out:
        $ref: iosxr_dial_out_config
      enabled:
        type: boolean
      encoding_preference:
        type: array
        items:
          type: string
      max_datapoints_per_batch:
        type: integer
      path_groups:
        type: object
        additionalProperties:
          $ref: iosxr_path_group_config
      paths:
        $ref: iosxr_path_override_config
      subscription:
        $ref: iosxr_subscription_config
      unsupported_path_action:
        type: string
  iosxr_credentials_config:
    description: IOSXRCredentialsConfig represents IOS XR gNMI metadata credentials.
    type: object
    properties:
      password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      username:
        type: string
  iosxr_dial_in_config:
    description: IOSXRDialInConfig defines dynamic IOS XR gNMI subscriptions initiated by the collector.
    type: object
    properties:
      targets:
        type: array
        items:
          $ref: iosxr_target_config
  iosxr_dial_out_config:
    description: IOSXRDialOutConfig defines IOS XR MDT gRPC dial-out server settings.
    type: object
    properties:
      allowed_clients:
        type: array
        items:
          type: string
      enabled:
        type: boolean
      identity_bindings:
        type: array
        items:
          $ref: gnmi_dial_out_identity_binding_config
      identity_verification:
        description: IdentityVerification controls whether source-to-node identity bindings are enforced for every MDT message. Valid values are legacy and required.
        type: string
      max_streams_per_client:
        description: MaxStreamsPerClient bounds concurrent dial-out streams from one source IP. Zero selects the smaller of 16 and MaxConcurrentStreams.
        type: integer
        x-customType: uint32
      module_paths:
        description: ModulePaths contains up to 64 regular .yang files or directories. Startup bounds traversal to 100,000 entries, 10,000 files, 16 MiB per file, and 128 MiB of module data across all configured paths.
        type: array
        items:
          type: string
      rate_limiting:
        $ref: /receiver/yanggrpcreceiver.rate_limiting_config
      stream_idle_timeout:
        description: StreamIdleTimeout closes a dial-out stream that sends no telemetry frame for this duration. Zero selects the production default of 30 minutes.
        type: string
        format: duration
    allOf:
