description: Config defines configuration for Cisco OS receiver.
type: object
properties:
  aci:
    description: ACI contains APIC API polling settings.
    $ref: aci_config
  catalyst_9800:
    description: Catalyst9800 contains direct Catalyst 9800 WLC telemetry settings.
    $ref: catalyst_9800_config
  catalyst_center:
    description: CatalystCenter contains Cisco Catalyst Center API polling settings.
    $ref: catalyst_center_config
  device_selection:
    description: DeviceSelection limits emitted telemetry to shared Cisco device identities.
    $ref: device_selection_config
  devices:
    description: Devices is the list of Cisco devices to monitor.
    type: array
    items:
      $ref: device_config
  fmc:
    description: FMC contains Secure Firewall Management Center REST and eStreamer settings.
    $ref: fmc_config
  gnmi:
    description: GNMI contains shared, normalized gNMI dial-in targets.
    $ref: gnmi_config
  intersight:
    description: Intersight contains Cisco Intersight API polling settings.
    $ref: intersight_config
  ios_xr:
    description: IOSXR contains IOS XR gNMI/MDT telemetry settings.
    $ref: iosxr_config
  ise:
    description: ISE contains Cisco Identity Services Engine REST, pxGrid, and Data Connect settings.
    $ref: ise_config
  meraki:
    description: Meraki contains Meraki Dashboard API polling targets.
    $ref: meraki_config
  metrics:
    description: Metrics controls per-metric forwarding for cost-sensitive destinations.
    type: object
    additionalProperties:
      $ref: metric_config
  nexus_dashboard:
    description: NexusDashboard contains Nexus Dashboard, NDFC, Insights, NDO, OneManage, and Data Broker API polling settings.
    $ref: nexus_dashboard_config
  scrapers:
    description: Map of scrapers to be run, keyed by scraper type.
    type: object
    properties:
      interfaces:
        $ref: ./internal/scraper/interfacesscraper.config
      system:
        $ref: ./internal/scraper/systemscraper.config
  sdwan:
    description: SDWAN contains Cisco Catalyst SD-WAN Manager API polling settings.
    $ref: sdwan_config
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
