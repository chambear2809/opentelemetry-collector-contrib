    family: ios_xr
    pid_patterns: ['^ASR-9[0-9]{3}(?:-[A-Z0-9]+)*$']
    release_patterns: ['^25\.2\.21$']
    sources: [ios_xr_platforms, ios_xr_recommended]
    runtime_eligible: false
    control_planes: [exr]
    hardware_classes: [chassis, route_processor, line_card, asic, optics, environment]
    findings: The dated release is recommended, but eXR control-plane identity and every modular hardware class remain unverified.
    coverage: &all_findings
      identity: findings
      system: findings
      interfaces: findings
      optics: findings
      inventory: findings
      environment: findings
      l2: findings
      routing: findings
      mpls: findings
