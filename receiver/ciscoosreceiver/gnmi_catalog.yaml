# These selectors are dated inventory/implementation candidates, not support
# claims. Recommended releases establish the row snapshot but never prove an
# operational path. Every current row remains Findings until exact PID/release
# fixtures, a live run, and simultaneous CLI/device-state evidence are recorded.
