profiles:
  - platform: ios_xe
    name: identity
    default_enabled: true
    default_interval: 5m
    synthetic_mappings:
      - {origin: cisco_os, elements: [target, ios_xe], leaf: up, metric: cisco.device.up, scale: 1}
    paths:
      - id: identity.system
        group: inventory
        path_set_id: identity.system
        variant_id: openconfig
        variant_order: 1
        source_preference: openconfig
        origin: rfc7951
        path: 'openconfig-system:system/state'
        encodings: [json_ietf, json]
        stream_modes: [target_defined]
        sample_interval: 5m
        feature_prerequisites: [gnmi_subscribe]
        selector_keys: []
        high_cardinality: false
        requires_max_entities: false
        model_provenance: pending
        disposition: findings
        findings: Model revision, fixture, and live identity evidence are pending.
  - platform: ios_xe
    name: system
    default_enabled: true
    default_interval: 1m
    paths:
      - id: system.cpu
        group: cpu
        path_set_id: system.cpu
        variant_id: native
        variant_order: 1
        source_preference: native
        origin: rfc7951
        path: 'Cisco-IOS-XE-process-cpu-oper:cpu-usage/cpu-utilization'
        encodings: [json_ietf, json]
        stream_modes: [sample, target_defined]
        sample_interval: 1m
        feature_prerequisites: [gnmi_subscribe, system_operational_data]
        selector_keys: []
        high_cardinality: false
        requires_max_entities: false
        model_provenance: pending
        disposition: findings
        findings: Model revision and fixture evidence are pending.
        mappings:
          - {elements: ['Cisco-IOS-XE-process-cpu-oper:cpu-usage', cpu-utilization], leaf: five-seconds, metric: system.cpu.utilization, scale: 0.01}
      - id: system.memory
        group: memory
        path_set_id: system.memory
        variant_id: native
        variant_order: 1
