ciscoos:
  collection_interval: 60s
  timeout: 30s
  scrapers:
    system:
      protocol_traffic:
        enabled: true
      control_plane:
        enabled: true
        process_top_n: 5
        commands:
          punt_rates: true
      routing_forwarding:
        vrfs: ["default", "Mgmt-vrf"]
        max_vrfs: 2
        commands:
          route_summary: true
          arp: true
      router_dataplane:
        commands:
          qfp_utilization: true
          qfp_drops: true
          qos_drops: true
          crypto_drops: true
      hardware_health:
        max_components: 64
        commands:
          environment: true
      routing_neighbors:
        vrfs: ["default"]
        max_neighbors: 128
        commands:
          bgp: true
      fabric:
        max_peers: 128
        max_vnis: 512
        commands:
          nve_peers: true
          nve_vnis: true
          evpn_routes: true
    interfaces:
      rates:
        enabled: true
      counters:
        enabled: true
        include: ["*error*", "*drop*", "pause_*"]
        max_per_interface: 25
        commands:
          flowcontrol: true
          qos_policy: true
      l2_topology:
        enabled: true
        include: ["Gi*", "Eth*"]
        exclude: ["*0/48"]
        max_interfaces: 32
        max_vlans: 64
        commands:
          vpc: true
          lldp: true
          cdp: true
      transceiver:
        enabled: true
        include: ["Te*", "Eth*"]
        max_interfaces: 16
  devices:
    - name: "device-1"
      host: "192.168.1.1"
      port: 22
      auth:
        username: "admin"
        password: "password"
        enable_password: "enable-password"
        insecure_skip_verify: true
    - name: "device-2"
      host: "192.168.1.2"
      port: 22
      auth:
        username: "admin"
        password: "password"
        insecure_skip_verify: true
  device_selection:
    include:
      host_names: ["device-1", "edge-1"]
      host_ids: ["host-1"]
      host_ips: ["192.168.1.1"]
      serials: ["Q234-ABCD-0001", "SERIAL-1", "FOC1234", "ACI-SERIAL-1", "FMC-SERIAL-1"]
      device_ids: ["device-uuid-1", "101"]
    exclude:
      host_names: ["lab-disabled"]
      host_ids: ["host-disabled"]
      host_ips: ["192.168.1.254"]
      serials: ["Q234-ABCD-9999"]
      device_ids: ["device-disabled"]
  metrics:
    sdwan.app_route.loss:
      enabled: false
    system.network.errors:
      enabled: false
    cisco.wlc.client.*:
      enabled: false
    cisco.iosxr.yang.cisco_ios_xr_ip_rib_ipv4_oper.*:
      enabled: false
  meraki:
    auth:
      api_key: "meraki-key"
    base_url: "https://api.meraki.com/api/v1"
    organizations:
      - organization_id: "123456"
        network_ids: ["N_1"]
        serials: ["Q234-ABCD-0001"]
        product_types: ["switch", "wireless"]
        tags: ["prod"]
        tags_filter_type: "withAnyTags"
    devices:
      - organization_id: "123456"
        serial: "Q234-ABCD-0002"
  intersight:
    enabled: true
    auth:
      key_id: "intersight-key"
      key_file: "/etc/otelcol/intersight.pem"
    endpoint: "https://intersight.example.com"
    insecure_skip_verify: true
    user_agent: "ciscoosreceiver-test"
    page_size: 50
    max_retries: 2
    event_lookback: 12h
    telemetry_lookback: 15m
    targets:
      serials: ["SERIAL-1"]
      moids: ["moid-1"]
    telemetry:
      enabled: false
      max_results: 25
    storage:
      enabled: true
      max_results: 75
  catalyst_center:
    enabled: true
    endpoint: "https://catalyst-center.example.com"
    insecure_skip_verify: true
    user_agent: "ciscoosreceiver-test"
    page_size: 250
    max_retries: 2
    lookback: 6h
    auth:
      mode: "basic"
      username: "admin"
      password: "password"
    targets:
      device_details:
        - identifier: "uuid"
          search_by: "device-uuid-1"
      client_macs: ["00:11:22:33:44:55"]
    topology:
      enabled: true
      max_results: 500
    issues:
      enabled: true
      max_results: 100
  sdwan:
    enabled: true
    endpoint: "https://sdwan-manager.example.com"
    insecure_skip_verify: true
    user_agent: "ciscoosreceiver-test"
    page_size: 300
    max_retries: 2
    event_lookback: 9h
    auth:
      mode: "jwt"
      username: "admin"
      password: "password"
    targets:
      site_ids: ["100"]
      system_ips: ["10.0.0.1"]
      uuids: ["sdwan-device-uuid-1"]
      serials: ["SDWAN-SERIAL-1"]
      device_types: ["vedge"]
      personalities: ["vedge"]
      colors: ["biz-internet"]
      interface_names: ["ge0/0"]
      vpn_ids: ["0"]
      applications: ["openai-api"]
      application_families: ["ai"]
      cloud_providers: ["aws"]
      service_types: ["saas"]
    control_plane:
      enabled: true
      max_results: 100
    bfd:
      enabled: true
      max_results: 200
    realtime_details:
      enabled: true
      max_results: 50
    cloud_onramp:
      enabled: true
      max_results: 75
  nexus_dashboard:
    enabled: true
    endpoint: "https://nexus-dashboard.example.com"
    insecure_skip_verify: true
    user_agent: "ciscoosreceiver-test"
    page_size: 75
    max_retries: 2
    event_lookback: 8h
    auth:
      mode: "api_key"
      username: "admin"
      api_key: "nd-api-key"
    targets:
      sites: ["site-a"]
      fabrics: ["fabric-a"]
      switch_serials: ["N9K-SERIAL-1"]
      switch_ids: ["101"]
      interface_names: ["eth1/1"]
      service_names: ["ndfc"]
    ndfc:
      enabled: true
      max_results: 250
    insights:
      enabled: true
      max_results: 150
    performance:
      enabled: true
      max_results: 200
  aci:
    enabled: true
    controllers:
      - endpoint: "https://apic1.example.com"
        name: "apic-1"
      - endpoint: "https://apic2.example.com"
        name: "apic-2"
    user_agent: "ciscoosreceiver-test"
    page_size: 80
    max_retries: 2
    insecure_skip_verify: true
    event_lookback: 10h
    auth:
      username: "admin"
      password: "password"
      domain: "local"
    targets:
      fabrics: ["aci"]
      node_ids: ["101"]
      serials: ["ACI-SERIAL-1"]
      tenants: ["prod"]
      vrfs: ["prod-vrf"]
      bridge_domains: ["prod-bd"]
      epgs: ["web"]
      interface_names: ["eth1/1"]
    faults:
      enabled: true
      max_results: 300
    endpoints:
      enabled: true
      max_results: 400
    tenants:
      enabled: true
      max_results: 500
  ise:
    enabled: true
    endpoint: "https://ise.example.com"
    user_agent: "ciscoosreceiver-test"
    page_size: 100
    max_retries: 2
    event_lookback: 7h
    session_lookback: 10m
    max_results: 900
    ca_file: "/etc/otelcol/ise-rest-ca.crt"
    server_name: "nyc-ise-01.ciscovalidated.com"
    insecure_skip_verify: false
    auth:
      username: "admin"
      password: "password"
    targets:
      node_names: ["ise-pan-1"]
      network_device_names: ["edge-switch-1"]
      network_device_ips: ["192.0.2.10"]
      endpoint_macs: ["00:11:22:33:44:55"]
      usernames: ["alice@example.com"]
      policy_names: ["wired-access"]
      security_group_names: ["Employees"]
      pxgrid_services: ["com.cisco.ise.session"]
    sessions:
      enabled: true
      max_results: 750
    auth_failures:
      enabled: true
      max_results: 300
    trustsec:
      enabled: true
      max_results: 200
    pxgrid:
      enabled: true
      node_name: "otel-collector"
      password: "pxgrid-secret"
      streaming: true
      max_results: 250
      subscriptions:
        session: true
        radius_failures: true
        endpoint: true
        trustsec: true
        system_health: true
    data_connect:
      enabled: true
      host: "ise.example.com"
      port: 2484
      service_name: "cpm10"
      username: "dataconnect"
      password: "db-secret"
      wallet_dir: "/etc/otelcol/ise-wallet"
      ssl: true
      ssl_verify: false
      lookback: 12h
      row_limit: 400
      views:
        RADIUS_AUTHENTICATIONS_WEEK:
          enabled: true
          max_results: 250
  catalyst_9800:
    enabled: true
    max_datapoints_per_batch: 10000
    path_groups:
      client_detail:
        enabled: true
      neighbors:
        enabled: false
      capwap_packets:
        enabled: false
    unsupported_path_action: "warn"
    encoding_preference: ["json_ietf", "json"]
    subscription:
      mode: "stream"
      stream_mode: "sample"
      sample_interval: 60s
      heartbeat_interval: 60s
      suppress_redundant: true
    dial_in:
      targets:
        - name: "campus-wlc-1"
          endpoint: "10.0.0.20:57400"
          platform_family: "catalyst_9800"
          credentials:
            username: "admin"
            password: "password"
          tls:
            insecure_skip_verify: true
          paths:
            include:
              - "wireless-client-oper:client-oper-data/common-oper-data"
            exclude:
              - "neighbors"
    dial_out:
      enabled: true
      endpoint: "0.0.0.0:57501"
      transport: "tcp"
      tls:
        cert_file: "/etc/otelcol/catalyst9800-server.crt"
        key_file: "/etc/otelcol/catalyst9800-server.key"
        client_ca_file: "/etc/otelcol/cisco-client-ca.crt"
      allowed_clients: ["10.0.0.0/8"]
      max_streams_per_client: 16
      rate_limiting:
        enabled: true
        requests_per_second: 100
        burst_size: 10
        cleanup_interval: 1m
  ios_xr:
    enabled: true
    max_datapoints_per_batch: 12000
    path_groups:
      interfaces:
        enabled: true
      optics:
        enabled: true
      bgp:
        enabled: true
    unsupported_path_action: "error"
    encoding_preference: ["json_ietf", "proto"]
    subscription:
      mode: "stream"
      stream_mode: "sample"
      sample_interval: 60s
      heartbeat_interval: 60s
      suppress_redundant: true
    dial_in:
      targets:
        - name: "core-asr9k-1"
          endpoint: "10.0.0.10:57400"
          platform_family: "ASR 9000"
          credentials:
            username: "admin"
            password: "password"
          tls:
            insecure_skip_verify: true
    dial_out:
      enabled: true
      endpoint: "0.0.0.0:57500"
      transport: "tcp"
      tls:
        cert_file: "/etc/otelcol/iosxr-server.crt"
        key_file: "/etc/otelcol/iosxr-server.key"
        client_ca_file: "/etc/otelcol/cisco-client-ca.crt"
      allowed_clients: ["10.0.0.0/8"]
      max_streams_per_client: 16
      rate_limiting:
        enabled: true
        requests_per_second: 100
        burst_size: 10
        cleanup_interval: 1m
  fmc:
    enabled: true
    controllers:
      - endpoint: "https://fmc1.example.com"
        name: "fmc-1"
        domain_uuid: "domain-uuid-1"
    user_agent: "ciscoosreceiver-test"
    page_size: 90
    max_retries: 2
    event_lookback: 11h
    insecure_skip_verify: true
    auth:
      username: "admin"
      password: "password"
    targets:
      device_ids: ["fmc-device-uuid-1"]
      serials: ["FMC-SERIAL-1"]
      names: ["ftd-edge-1"]
      management_ips: ["192.0.2.40"]
      policy_ids: ["policy-uuid-1"]
      policy_names: ["edge-access-policy"]
      interface_names: ["GigabitEthernet0/0"]
    inventory:
      enabled: true
      max_results: 250
    interfaces:
      enabled: true
      max_results: 500
    health:
      enabled: true
      max_results: 150
    vpn:
      enabled: true
      max_results: 175
    ha:
      enabled: true
      max_results: 50
    policy:
      enabled: true
      max_results: 300
    deployments:
      enabled: true
      max_results: 125
    audit:
      enabled: true
      max_results: 100
    estreamer:
      enabled: true
      targets:
        - endpoint: "fmc1.example.com:8302"
          name: "fmc-1"
      tls:
        cert_file: "/etc/otelcol/fmc-estreamer.crt"
        key_file: "/etc/otelcol/fmc-estreamer.key"
        ca_file: "/etc/otelcol/fmc-ca.crt"
        server_name: "fmc1.example.com"
        insecure_skip_verify: true
      event_types: ["connection", "intrusion", "intrusion_packet", "file"]
      lookback: 10m
      reconnect_interval: 20s
      max_message_bytes: 1048576
