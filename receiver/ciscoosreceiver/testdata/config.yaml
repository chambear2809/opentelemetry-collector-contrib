ciscoos:
  collection_interval: 60s
  timeout: 30s
  scrapers:
    system:
      protocol_traffic:
        enabled: true
      control_plane:
        enabled: true
        process_top_n: 5
        commands:
          punt_rates: true
      routing_forwarding:
        vrfs: ["default", "Mgmt-vrf"]
        max_vrfs: 2
        commands:
          route_summary: true
          arp: true
      router_dataplane:
        commands:
          qfp_utilization: true
          qfp_drops: true
          qos_drops: true
          crypto_drops: true
      hardware_health:
        max_components: 64
        commands:
          environment: true
      routing_neighbors:
        vrfs: ["default"]
        max_neighbors: 128
        commands:
          bgp: true
      fabric:
        max_peers: 128
        max_vnis: 512
        commands:
          nve_peers: true
          nve_vnis: true
          evpn_routes: true
    interfaces:
      rates:
        enabled: true
      counters:
        enabled: true
        include: ["*error*", "*drop*", "pause_*"]
        max_per_interface: 25
        commands:
          flowcontrol: true
          qos_policy: true
      l2_topology:
        enabled: true
        include: ["Gi*", "Eth*"]
        exclude: ["*0/48"]
        max_interfaces: 32
        max_vlans: 64
        commands:
          vpc: true
          lldp: true
          cdp: true
      transceiver:
        enabled: true
        include: ["Te*", "Eth*"]
        max_interfaces: 16
  devices:
    - name: "device-1"
      host: "192.168.1.1"
      port: 22
      auth:
        username: "admin"
        password: "password"
        enable_password: "enable-password"
        insecure_skip_verify: true
    - name: "device-2"
      host: "192.168.1.2"
      port: 22
      auth:
        username: "admin"
        password: "password"
        insecure_skip_verify: true
  device_selection:
    include:
      host_names: ["device-1", "edge-1"]
      host_ids: ["host-1"]
      host_ips: ["192.168.1.1"]
      serials: ["Q234-ABCD-0001", "SERIAL-1", "FOC1234", "ACI-SERIAL-1"]
      device_ids: ["device-uuid-1", "101"]
    exclude:
      host_names: ["lab-disabled"]
      host_ids: ["host-disabled"]
      host_ips: ["192.168.1.254"]
      serials: ["Q234-ABCD-9999"]
      device_ids: ["device-disabled"]
  metrics:
    sdwan.app_route.loss:
      enabled: false
    system.network.errors:
      enabled: false
  meraki:
    auth:
      api_key: "meraki-key"
    base_url: "https://api.meraki.com/api/v1"
    organizations:
      - organization_id: "123456"
        network_ids: ["N_1"]
        serials: ["Q234-ABCD-0001"]
        product_types: ["switch", "wireless"]
        tags: ["prod"]
        tags_filter_type: "withAnyTags"
    devices:
      - organization_id: "123456"
        serial: "Q234-ABCD-0002"
  intersight:
    enabled: true
    auth:
      key_id: "intersight-key"
      key_file: "/etc/otelcol/intersight.pem"
    endpoint: "https://intersight.example.com"
    user_agent: "ciscoosreceiver-test"
    page_size: 50
    max_retries: 2
    event_lookback: 12h
    telemetry_lookback: 15m
    targets:
      serials: ["SERIAL-1"]
      moids: ["moid-1"]
    telemetry:
      enabled: false
      max_results: 25
    storage:
      enabled: true
      max_results: 75
  catalyst_center:
    enabled: true
    endpoint: "https://catalyst-center.example.com"
    user_agent: "ciscoosreceiver-test"
    page_size: 250
    max_retries: 2
    lookback: 6h
    auth:
      mode: "basic"
      username: "admin"
      password: "password"
    targets:
      device_details:
        - identifier: "uuid"
          search_by: "device-uuid-1"
      client_macs: ["00:11:22:33:44:55"]
    topology:
      enabled: true
      max_results: 500
    issues:
      enabled: true
      max_results: 100
  sdwan:
    enabled: true
    endpoint: "https://sdwan-manager.example.com"
    user_agent: "ciscoosreceiver-test"
    page_size: 300
    max_retries: 2
    event_lookback: 9h
    statistics_lookback: 20m
    realtime_lookback: 3m
    auth:
      mode: "jwt"
      username: "admin"
      password: "password"
    targets:
      site_ids: ["100"]
      system_ips: ["10.0.0.1"]
      uuids: ["sdwan-device-uuid-1"]
      serials: ["SDWAN-SERIAL-1"]
      device_types: ["vedge"]
      personalities: ["vedge"]
      colors: ["biz-internet"]
      interface_names: ["ge0/0"]
      vpn_ids: ["0"]
      applications: ["openai-api"]
      application_families: ["ai"]
      cloud_providers: ["aws"]
      service_types: ["saas"]
    control_plane:
      enabled: true
      max_results: 100
    bfd:
      enabled: true
      max_results: 200
    realtime_details:
      enabled: true
      max_results: 50
    cloud_onramp:
      enabled: true
      max_results: 75
  nexus_dashboard:
    enabled: true
    endpoint: "https://nexus-dashboard.example.com"
    user_agent: "ciscoosreceiver-test"
    page_size: 75
    max_retries: 2
    event_lookback: 8h
    telemetry_lookback: 20m
    service_discovery: true
    auth:
      mode: "api_key"
      username: "admin"
      api_key: "nd-api-key"
    targets:
      sites: ["site-a"]
      fabrics: ["fabric-a"]
      switch_serials: ["N9K-SERIAL-1"]
      switch_ids: ["101"]
      interface_names: ["eth1/1"]
      service_names: ["ndfc"]
    ndfc:
      enabled: true
      max_results: 250
    insights:
      enabled: true
      max_results: 150
    performance:
      enabled: true
      max_results: 200
  aci:
    enabled: true
    controllers:
      - endpoint: "https://apic1.example.com"
        name: "apic-1"
      - endpoint: "https://apic2.example.com"
        name: "apic-2"
    user_agent: "ciscoosreceiver-test"
    page_size: 80
    max_retries: 2
    event_lookback: 10h
    stats_lookback: 25m
    auth:
      username: "admin"
      password: "password"
      domain: "local"
    targets:
      fabrics: ["aci"]
      node_ids: ["101"]
      serials: ["ACI-SERIAL-1"]
      tenants: ["prod"]
      vrfs: ["prod-vrf"]
      bridge_domains: ["prod-bd"]
      epgs: ["web"]
      interface_names: ["eth1/1"]
    faults:
      enabled: true
      max_results: 300
    endpoints:
      enabled: true
      max_results: 400
    tenants:
      enabled: true
      max_results: 500
