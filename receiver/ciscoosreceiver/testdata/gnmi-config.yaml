receivers:
  cisco_os:
    gnmi:
      max_datapoints_per_chunk: 10000
      max_cached_series: 500000
      targets:
        - name: nexus-shard-01
          endpoint: nexus01.example.net:50051
          platform: nx_os
          product_family: nx_os
          max_recv_msg_size_mib: 16
          sync_timeout: 3m
          encoding_preference: [json, json_ietf]
          credentials:
            mode: username_password
            username: otel-telemetry
            password: secret
          tls:
            ca_file: /etc/otel/cisco-ca.pem
            min_version: "1.2"
            server_name_override: nexus01.example.net
            reload_interval: 1h
          keepalive:
            time: 30s
            timeout: 10s
            permit_without_stream: false
          profiles:
            identity:
              enabled: true
            interfaces:
              enabled: true
            optics:
              enabled: true
              required: true
              sample_interval: 30s
              stream_mode: on_change
              groups:
                vdm:
                  enabled: true
                  sample_interval: 45s
                  stream_mode: sample
                  sync_timeout: 1m
                  max_entities: 128
                  selectors:
                    network.interface.name: [Ethernet1/1, Ethernet1/2]
