$defs:
  auth_config:
    description: AuthConfig represents authentication configuration
    type: object
    properties:
      enable_password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      insecure_skip_verify:
        description: InsecureSkipVerify disables SSH host key verification. Dangerous in production; only use in isolated lab environments. Either this or KnownHostsFile is required.
        type: boolean
      key_file:
        type: string
      known_hosts_file:
        description: KnownHostsFile is the path to a known_hosts file used for SSH host key verification. Either KnownHostsFile or InsecureSkipVerify must be set.
        type: string
      password:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      username:
        type: string
  device_config:
    description: DeviceConfig represents configuration for a single Cisco device using semantic conventions
    type: object
    properties:
      auth:
        $ref: auth_config
      device:
        $ref: device_info
  device_info:
    description: DeviceInfo follows semantic conventions for device identification
    type: object
    properties:
      host:
        $ref: host_info
  host_info:
    description: HostInfo contains host-specific information
    type: object
    properties:
      ip:
        type: string
      name:
        type: string
      port:
        type: integer
