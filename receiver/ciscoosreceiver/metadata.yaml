  cisco.optics.voltage:
    attributes: [network.interface.name, cisco.optics.lane, cisco.optics.sensor, cisco.optics.profile, cisco.optics.experimental]
    description: Optical module supply voltage
    enabled: true
    gauge:
      value_type: double
    stability: development
    unit: V
  system.cpu.utilization:
    description: Percentage of CPU time in use.
    enabled: true
    gauge:
      value_type: double
    stability: development
    unit: "1"
  system.memory.utilization:
    description: Percentage of memory bytes in use.
    enabled: true
    gauge:
      value_type: double
    stability: development
    unit: "1"
  system.network.errors:
    attributes: [network.io.direction, network.interface.name]
    description: The number of errors encountered
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{error}"
  system.network.interface.status:
    attributes: [network.interface.name]
    description: Interface operational status (1 = up, 0 = down)
    enabled: true
    gauge:
      value_type: int
    stability: development
    unit: "1"
  system.network.io:
    attributes: [network.io.direction, network.interface.name]
    description: The number of bytes transmitted and received
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: By
  system.network.packet.count:
    attributes: [network.io.direction, network.packet.type, network.interface.name]
    description: The number of packets transmitted or received, categorized by type
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{packet}"
  system.network.packet.dropped:
    attributes: [network.io.direction, network.interface.name]
    description: The number of packets dropped
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{packet}"
  system.uptime:
    description: The time the Cisco device has been running
    enabled: true
    gauge:
      value_type: int
    stability: development
    unit: s
resource_attributes:
  cisco.os.name:
    description: Normalized Cisco operating-system family
    enabled: true
    type: string
  cisco.platform.family:
    description: Configured Cisco platform family for the gNMI target
    enabled: true
    type: string
  cisco.telemetry.transport:
    description: Cisco telemetry transport that produced the metrics
    enabled: true
    type: string
  host.id:
    description: Stable configured identity of the Cisco target
    enabled: true
    type: string
  host.ip:
    description: Management IP of the Cisco target when the endpoint uses an IP literal
    enabled: true
    type: string
  host.name:
    description: Configured name of the Cisco target
    enabled: true
    type: string
  hw.type:
    description: Type of the physical hardware
    enabled: true
    type: string
  os.name:
    description: Human-readable Cisco operating-system name
    enabled: true
    type: string
status:
  class: receiver
  codeowners:
    active: [dmitryax]
  distributions: [contrib]
  stability:
    alpha: [metrics, logs]
telemetry:
  metrics:
    ciscoosreceiver_gnmi_authentication_failures:
      attributes: [cisco.gnmi.target]
      description: Number of gNMI authentication or authorization failures
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{failure}"
    ciscoosreceiver_gnmi_cache_utilization:
      description: Fraction of the configured mapped-series cache currently in use
      enabled: true
      gauge:
        value_type: double
      stability: development
      unit: "1"
    ciscoosreceiver_gnmi_connections:
      attributes: [cisco.gnmi.target]
      description: Current number of established gNMI connections
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "{connection}"
    ciscoosreceiver_gnmi_consumer_refusals:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of metric chunks refused by the downstream consumer and dropped without device reconnect
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{refusal}"
    ciscoosreceiver_gnmi_decode_errors:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of gNMI notifications that could not be decoded
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{error}"
    ciscoosreceiver_gnmi_deletes:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of gNMI delete paths applied to the state cache
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{delete}"
    ciscoosreceiver_gnmi_duplicate_updates:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of duplicate gNMI leaf updates suppressed by the state cache
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{update}"
    ciscoosreceiver_gnmi_invalid_timestamps:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of invalid Cisco timestamps replaced with receipt time
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{timestamp}"
    ciscoosreceiver_gnmi_last_success_unixtime:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Unix time of the most recent successfully decoded gNMI notification
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: s
    ciscoosreceiver_gnmi_profile_degraded:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile, cisco.gnmi.reason]
      description: Whether a gNMI profile is degraded (1 = degraded, 0 = healthy)
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "1"
    ciscoosreceiver_gnmi_reconnects:
      attributes: [cisco.gnmi.target]
      description: Number of gNMI transport reconnect attempts
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{reconnect}"
    ciscoosreceiver_gnmi_subscriptions:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Current number of active gNMI subscription streams
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "{subscription}"
    ciscoosreceiver_gnmi_unmapped_values:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of decoded gNMI values without an explicit metric mapping
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{value}"
    ciscoosreceiver_gnmi_updates:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of decoded gNMI leaf updates
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{update}"
type: cisco_os
