    description: Normalized Cisco operating-system family
    enabled: true
    type: string
  cisco.platform.family:
    description: Legacy Cisco platform or operating-system-family compatibility alias whose value depends on the source
    enabled: true
    type: string
  cisco.product.family:
    description: Verified canonical Cisco product family
    enabled: true
    type: string
  cisco.telemetry.transport:
    description: Cisco telemetry transport that produced the metrics
    enabled: true
    type: string
  device.manufacturer:
    description: Manufacturer of the device
    enabled: true
    type: string
