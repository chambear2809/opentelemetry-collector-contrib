  cisco.optics.laser_bias_current:
    attributes: [network.interface.name, cisco.optics.lane, cisco.optics.sensor, cisco.optics.profile, cisco.optics.experimental]
    description: Optical transmitter laser bias current
    enabled: true
    gauge:
      value_type: double
    stability: development
    unit: mA
  cisco.optics.osnr:
    attributes: [network.interface.name, cisco.optics.lane, cisco.optics.sensor, cisco.optics.profile, cisco.optics.experimental]
    description: Coherent optical signal-to-noise ratio
    enabled: true
    gauge:
      value_type: double
    stability: development
