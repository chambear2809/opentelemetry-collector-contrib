    description: Verified device chassis model identifier
    enabled: true
    type: string
  host.id:
    description: Stable configured identity of the Cisco target
    enabled: true
    type: string
  host.ip:
    description: Management IP of the Cisco target when the endpoint uses an IP literal
    enabled: true
    type: string
  host.name:
    description: Configured name of the Cisco target
    enabled: true
    type: string
  hw.type:
    description: Type of the physical hardware
    enabled: true
    type: string
  os.name:
    description: Human-readable Cisco operating-system name
    enabled: true
    type: string
  os.version:
    description: Device-reported software version; shared gNMI emits the canonical live-verified public release
    enabled: true
    type: string
status:
  class: receiver
  codeowners:
    active: [dmitryax]
  distributions: [contrib]
  stability:
    alpha: [metrics, logs]
telemetry:
  metrics:
    ciscoosreceiver_gnmi_authentication_failures:
      attributes: [cisco.gnmi.target]
      description: Number of gNMI authentication or authorization failures
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{failure}"
    ciscoosreceiver_gnmi_auxiliary_state_utilization:
      attributes: [cisco.gnmi.target]
      description: Maximum of the retained-entry and retained-byte utilization for the target's gNMI auxiliary-state partition
      enabled: true
      gauge:
        value_type: double
      stability: development
      unit: "1"
    ciscoosreceiver_gnmi_cache_owner_resets:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of silent owner-scoped gNMI cache resets performed before an updates-only stream reconnects
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{reset}"
    ciscoosreceiver_gnmi_cache_utilization:
      attributes: [cisco.gnmi.target]
      description: Maximum of the retained-entry and retained-byte utilization for the target's gNMI cache partition
      enabled: true
      gauge:
        value_type: double
      stability: development
      unit: "1"
    ciscoosreceiver_gnmi_connections:
      attributes: [cisco.gnmi.target]
      description: Current number of established gNMI connections
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "{connection}"
    ciscoosreceiver_gnmi_consumer_refusals:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of metric chunks refused by the downstream consumer before the affected gNMI profile reconnects
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{refusal}"
    ciscoosreceiver_gnmi_decode_errors:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of gNMI notifications that could not be decoded
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{error}"
    ciscoosreceiver_gnmi_deletes:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of gNMI delete paths applied to the state cache
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{delete}"
    ciscoosreceiver_gnmi_duplicate_updates:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of duplicate gNMI leaf updates suppressed by the state cache
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{update}"
    ciscoosreceiver_gnmi_invalid_timestamps:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of invalid or excessively future-dated Cisco timestamps rejected before cache mutation
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{timestamp}"
    ciscoosreceiver_gnmi_last_success_unixtime:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Unix time of the most recent successfully decoded gNMI notification
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: s
    ciscoosreceiver_gnmi_out_of_order_updates:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of stale gNMI cache operations suppressed by source timestamp ordering
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{update}"
    ciscoosreceiver_gnmi_preflight_failures:
      attributes: [cisco.gnmi.target, cisco.gnmi.reason]
      description: >-
        Number of terminal gNMI product-contract preflight compatibility failures. This metric emits only identity_missing,
        identity_ambiguous, product_mismatch, release_mismatch, missing_model, unsupported_model_version,
        unsupported_encoding, unsupported_gnmi_version, unsupported_boot_mode, or malformed_identity;
        profile-degradation reasons in the shared attribute catalog are not emitted here.
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{failure}"
    ciscoosreceiver_gnmi_product_verified:
      attributes: [cisco.gnmi.target]
      description: Whether the gNMI target passed product, model, release, required boot-mode, and capability verification
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "1"
    ciscoosreceiver_gnmi_profile_degraded:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile, cisco.gnmi.reason]
      description: Whether a gNMI profile is degraded (1 = degraded, 0 = healthy)
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "1"
    ciscoosreceiver_gnmi_reconnects:
      attributes: [cisco.gnmi.target]
      description: Number of gNMI transport reconnect attempts
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{reconnect}"
    ciscoosreceiver_gnmi_subscriptions:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Current number of active gNMI subscription streams
      enabled: true
      gauge:
        value_type: int
      stability: development
      unit: "{subscription}"
    ciscoosreceiver_gnmi_unmapped_values:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of decoded gNMI values without an explicit metric mapping
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{value}"
    ciscoosreceiver_gnmi_unsupported_value_kinds:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile, cisco.gnmi.value_kind]
      description: Number of bounded opaque or aggregate gNMI TypedValues ignored by kind
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{value}"
    ciscoosreceiver_gnmi_updates:
      attributes: [cisco.gnmi.target, cisco.gnmi.profile]
      description: Number of decoded gNMI leaf updates
      enabled: true
      stability: development
      sum:
        monotonic: true
        value_type: int
      unit: "{update}"
type: cisco_os
