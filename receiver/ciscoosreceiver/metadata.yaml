  cisco.optics.q_margin:
    attributes: [network.interface.name, cisco.optics.lane, cisco.optics.sensor, cisco.optics.profile, cisco.optics.experimental]
    description: Coherent optical Q-margin
    enabled: true
    gauge:
      value_type: double
    stability: development
